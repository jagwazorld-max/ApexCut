name: apex_cut
description: Professional photo & video editor by JagX + JRILICENSE.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  video_player: ^2.9.1
  image_picker: ^1.1.2
  photo_manager: ^3.2.2
  image: ^4.2.0
  path_provider: ^2.1.4
  path: ^1.9.0

  flutter_tts: ^4.0.2
  record: ^5.1.2
  audioplayers: ^6.1.0

  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  uuid: ^4.4.2
  collection: ^1.18.0
  intl: ^0.19.0
  equatable: ^2.0.5

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/filters/
    - assets/stickers/
    - assets/fonts/
    - assets/music/
    - assets/luts/
    - assets/templates/
