name: ApexCut Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos || true

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Ensure Android platform
        run: |
          flutter create --platforms=android . || true
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --split-per-abi || flutter build apk --release || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 14

  build-ios:
    name: iOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Ensure iOS platform
        run: |
          flutter create --platforms=ios . || true
          flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: build/ios/iphoneos
          if-no-files-found: ignore
          retention-days: 7

  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if (-not (Test-Path windows)) { flutter create --platforms=windows . }
          flutter pub get
      - name: Build Windows
        run: flutter build windows --release
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: ignore
          retention-days: 14

  build-macos:
    name: macOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable macOS
        run: |
          flutter config --enable-macos-desktop
          if [ ! -d macos ]; then flutter create --platforms=macos .; fi
          flutter pub get
      - name: Build macOS
        run: flutter build macos --release || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release
          path: build/macos/Build/Products/Release
          if-no-files-found: ignore
          retention-days: 14
