name: ApexCut Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Assets + icon
        run: |
          mkdir -p assets/icons assets/branding assets/filters assets/stickers assets/fonts assets/music assets/luts assets/templates
          python3 scripts/generate_icon.py || true
          # Keep branded crest path ready
          if [ -f assets/icons/app_icon.png ]; then echo "app icon ok"; fi

      - name: Scaffold Android
        run: bash scripts/ci_prepare.sh android

      - name: Apply launcher icons
        run: |
          dart run flutter_launcher_icons || true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: List outputs
        run: find build/app/outputs -type f -name '*.apk' -o -name '*.aab' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 55
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Windows
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/ci_prepare.ps1 -Platform windows
      - name: Build Windows
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = Get-ChildItem -Path build\windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner' } | Select-Object -First 1
          if ($src) {
            Compress-Archive -Path (Join-Path $src.FullName '*') -DestinationPath dist/ApexCut-windows.zip -Force
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-release
          path: dist/ApexCut-windows.zip
          if-no-files-found: warn

  build-ios:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 55
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold iOS
        run: bash scripts/ci_prepare.sh ios
      - name: Build iOS simulator (no team needed)
        run: flutter build ios --simulator --debug || flutter build ios --release --no-codesign || true
      - name: Package if present
        run: |
          mkdir -p dist
          APP=$(find build/ios -name "Runner.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" dist/ApexCut-ios.zip
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-build
          path: dist/ApexCut-ios.zip
          if-no-files-found: warn

  release-android:
    name: Release Android
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apks
      - name: Show APKs
        run: ls -la apks/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: ApexCut Android ${{ github.run_number }}
          body: |
            **ApexCut by JagX + JRILICENSE**

            Android release APKs attached.
            Install the `app-release.apk` or ABI-specific APK on your phone.
          files: apks/*
          fail_on_unmatched_files: false
