name: ApexCut Multi-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  # ====================== ANALYZE ======================
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Check formatting
        run: dart format --set-exit-if-changed . || true

  # ====================== ANDROID ======================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios,windows,macos .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: ignore

  # ====================== iOS ======================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create platform folders if missing
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios .
          fi

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: build/ios/iphoneos
          retention-days: 7
          if-no-files-found: ignore

  # ====================== WINDOWS ======================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable & create Windows
        run: |
          flutter config --enable-windows-desktop
          if (-not (Test-Path windows)) { flutter create --platforms=windows . }

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          retention-days: 14
          if-no-files-found: ignore

  # ====================== macOS ======================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable & create macOS
        run: |
          flutter config --enable-macos-desktop
          if [ ! -d macos ]; then flutter create --platforms=macos .; fi

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release
          path: build/macos/Build/Products/Release
          retention-days: 14
          if-no-files-found: ignore
