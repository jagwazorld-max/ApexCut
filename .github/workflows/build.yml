name: ApexCut Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Assets
        run: |
          mkdir -p assets/icons assets/filters assets/stickers assets/fonts assets/music assets/luts assets/templates
          python3 scripts/generate_icon.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Android
        run: bash scripts/ci_prepare.sh android
      - name: Build APK + App Bundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold iOS
        run: bash scripts/ci_prepare.sh ios
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package iOS app
        run: |
          mkdir -p dist
          APP=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "Runner.app missing"; find build/ios -maxdepth 4; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/ApexCut-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/ApexCut-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Windows
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/ci_prepare.ps1 -Platform windows
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = Get-ChildItem -Path build\windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner' } |
            Select-Object -First 1
          if (-not $src) { throw "Windows Release folder missing" }
          Compress-Archive -Path (Join-Path $src.FullName '*') -DestinationPath dist/ApexCut-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/ApexCut-windows.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold macOS
        run: bash scripts/ci_prepare.sh macos
      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS
        run: |
          mkdir -p dist
          APP=$(find build/macos -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "macOS .app missing"; find build/macos -maxdepth 6; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/ApexCut-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/ApexCut-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Scaffold Linux
        run: bash scripts/ci_prepare.sh linux
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Linux
        run: |
          mkdir -p dist
          BUNDLE=$(find build/linux -type d -name bundle | head -n 1)
          if [ -z "$BUNDLE" ]; then echo "Linux bundle missing"; find build/linux -maxdepth 5; exit 1; fi
          tar -C "$BUNDLE" -czf dist/ApexCut-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/ApexCut-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Web
        run: bash scripts/ci_prepare.sh web
      - name: Build Web
        run: flutter build web --release
      - name: Package Web
        run: |
          mkdir -p dist
          tar -C build/web -czf dist/ApexCut-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/ApexCut-web.tar.gz
          if-no-files-found: warn
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [analyze, build-android, build-ios, build-windows, build-macos, build-linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: ApexCut ${{ github.run_number }}
          body: |
            Installable ApexCut builds from GitHub Actions.

            - Android APKs (split per ABI + universal) and Play App Bundle
            - iOS unsigned Runner.app
            - Windows zip
            - macOS .app zip
            - Linux bundle
            - Web static build

            Download the files attached to this release.
          files: artifacts/**/*
          fail_on_unmatched_files: true
